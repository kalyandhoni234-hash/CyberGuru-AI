name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

# ---------------------------------------------------------------------------
# Pipeline order:
#   lint  ──►  test   ──►  deploy  (main push only)
#              security ──►  (same gate)
# ---------------------------------------------------------------------------

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --output-format=github

  # ── 2. Security scan ──────────────────────────────────────────────────────
  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        # Medium+ severity & confidence; exclude test files and any venv dir
        run: |
          bandit -r . \
            -x ./tests,./venv,./.venv \
            --severity-level medium \
            --confidence-level medium

  # ── 3. Tests ──────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Placeholder values — unit tests must not call live APIs.
      # Add TEST_DATABASE_URL as a GitHub secret for integration tests.
      GEMINI_API_KEY:  ci-placeholder
      GROQ_API_KEY:    ci-placeholder
      SECRET_KEY:      ci-test-secret-not-for-production
      REDIS_URL:       redis://localhost:6379
      DATABASE_URL:    ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # ── 4. Deploy (main push only) ────────────────────────────────────────────
  deploy:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: [test, security]
    # Only fire on a direct push to main (not on PRs, not on develop)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        # Add your Render deploy hook URL as the GitHub secret RENDER_DEPLOY_HOOK_URL
        # Dashboard → Web Service → Settings → Deploy Hook → Copy URL
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render returned HTTP $STATUS"
          [[ "$STATUS" =~ ^2 ]] || exit 1